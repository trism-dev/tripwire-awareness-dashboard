services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tripwire
      POSTGRES_PASSWORD: tripwire
      POSTGRES_DB: tripwire
    ports:
      - "5434:5432"  # 5432/5433 are often taken by other local projects
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripwire"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
