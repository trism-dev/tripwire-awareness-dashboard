services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tripwire
      POSTGRES_PASSWORD: tripwire
      POSTGRES_DB: tripwire
    ports:
      - "5434:5432"  # 5432/5433 are often taken by other local projects
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripwire"]
      interval: 5s
      retries: 10

  worker:
    build: .
    command: python -m worker.run
    environment:
      DATABASE_URL: postgresql://tripwire:tripwire@db:5432/tripwire
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  app:
    build: .
    command: streamlit run app/Home.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    environment:
      DATABASE_URL: postgresql://tripwire:tripwire@db:5432/tripwire
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
