name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16  # mirror of the official image: Docker Hub rate-limits CI runners
        env:
          POSTGRES_USER: tripwire
          POSTGRES_PASSWORD: tripwire
          POSTGRES_DB: tripwire
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tripwire"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://tripwire:tripwire@localhost:5432/tripwire
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
